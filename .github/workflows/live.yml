name: Live check

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript against the live Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run test:live || (sleep 60 && npm run test:live)

  python:
    name: Python against the live Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      LIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_live.py || (sleep 60 && python -m pytest -q tests/test_live.py)
